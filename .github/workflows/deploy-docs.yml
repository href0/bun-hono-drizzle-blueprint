name: Deploy Documentation Portal

# Manual only: GitHub Pages sites are public (also for private repositories), so publishing the
# docs is a conscious decision — Actions → "Deploy Documentation Portal" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      # sync-docs.ts → astro build → check-links.ts (fails on any broken internal link)
      - name: Build documentation portal
        working-directory: docs-site
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
