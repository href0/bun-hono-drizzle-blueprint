name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository: the token cannot push, comment or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Local hooks can be skipped with --no-verify; CI re-checks branch name and commit messages.
      # Dependabot's pull requests are exempt from both: its branches are always `dependabot/…` and
      # its commit bodies carry long release-note links (.github/dependabot.yml sets `chore(deps)`).
      - name: Branch name
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: bunx validate-branch-name -t "${{ github.head_ref }}"

      - name: Commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: File naming
        run: bun run lint:ls

      - name: Formatting
        run: bun run format:check

      - name: Architecture boundaries
        run: bun run lint:arch

      - name: Unused files, exports and dependencies
        run: bun run lint:deps

      - name: Setup registries (IDENTITY_RULES, EXAMPLE_MODULES)
        run: bun run lint:setup

      # Check only, never write the snapshot here: accepting a contract change is the developer's call.
      - name: API contract matches docs/api/openapi.json
        run: bun run openapi:check

      - name: Unit + e2e tests and coverage gate
        run: bun run test:cov

      - name: Build
        run: bun run build

      - name: Scaffold template verification
        run: bun run verify:scaffold

  # Integration suite: real PostgreSQL and Redis as service containers. Locally the
  # same suite runs against native services (`bun run test:int`, see scripts/test-integration.ts).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TZ: UTC
      # The runner creates and drops its own disposable database from this one.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration tests (PostgreSQL 16 + Redis 7)
        run: bun run test:int

  # The deployment path of docs/deployment.md: both images build, the tools image migrates a real
  # database, and the production image starts with production settings and reports healthy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t app:ci .

      - name: Build the tools image
        run: docker build --target tools -t app-tools:ci .

      - name: Migrate with the tools image
        run: docker run --rm --network host -e DATABASE_URL app-tools:ci

      # Throwaway secrets: this container only proves that the image starts.
      - name: Start the production image and wait until healthy
        run: |
          secrets=(-e "JWT_SECRET=$(openssl rand -hex 48)")
          # partner:start
          secrets+=(-e "PARTNER_SECRET_KEYS=k1:$(openssl rand -hex 32)" -e PARTNER_SECRET_ACTIVE_KEY_ID=k1)
          # partner:end
          docker run -d --name app --network host \
            -e DATABASE_URL -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            "${secrets[@]}" \
            -e CORS_ORIGINS=https://app.example.com \
            app:ci
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            if [ "$status" = healthy ]; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' app)" != true ]; then break; fi
            sleep 2
          done
          docker logs app
          test "$(docker inspect --format '{{.State.Health.Status}}' app)" = healthy
          curl --fail --silent --show-error http://localhost:3000/api/health/readiness

  # The documentation portal: every synced page is in the sidebar and no internal link is broken.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build the portal (sync, astro build, link check)
        run: bun run docs:build
