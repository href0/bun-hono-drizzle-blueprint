# ls-lint checks directory names and file names whose whole extension is `.ts` only: a name with
# more dots (users.controller.ts has extension `.controller.ts`) is not matched by `.ts` rules.
# Every file name, the module/integration naming patterns and channel mounting are checked by
# test/structure.test.ts (adoption plan D24).
ls:
  src:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/modules:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/core:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/utils:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/config:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/database:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  src/integrations:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  test:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$

  scripts:
    .dir: kebab-case
    .ts: kebab-case | regex:[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*\.ts$
