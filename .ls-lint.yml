# ls-lint: directory names, and file names whose whole extension is `.ts` (a rule on a directory
# also applies to every directory below it). A name with more dots (users.controller.ts has
# extension `.controller.ts`) is not matched by `.ts` rules: every file name, the module /
# integration naming patterns and channel mounting are checked by test/structure.test.ts
# (adoption plan D24).
ls:
  src:
    .dir: kebab-case
    .ts: kebab-case

  test:
    .dir: kebab-case
    .ts: kebab-case

  scripts:
    .dir: kebab-case
    .ts: kebab-case
