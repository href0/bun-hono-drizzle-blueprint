name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Local hooks can be skipped with --no-verify; CI re-checks branch name and commit messages.
      - name: Branch name
        if: github.event_name == 'pull_request'
        run: bunx validate-branch-name -t "${{ github.head_ref }}"

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: File naming
        run: bun run lint:ls

      - name: Formatting
        run: bun run format:check

      - name: Architecture boundaries
        run: bun run lint:arch

      - name: Unused files, exports and dependencies
        run: bun run lint:deps

      - name: Tests and coverage gate
        run: bun run test:cov

      - name: Build
        run: bun run build
